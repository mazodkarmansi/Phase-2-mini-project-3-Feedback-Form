<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <hr>
    <h1>📩 Submit Feedback</h1>

    <hr>
    <br>

    <p><strong> We value your feedback. Please fill out the form below and share your experience with this student portal.</strong></p>

    <h2>Information to collect</h2>
    <form>

        <label>Name:</label><br>
        <input type="text" placeholder="Add your Name" name="username"  >
        <br><br>
        
        <label>Email:</label><br>
        <input type="email" placeholder="Add your Email" name="useremail">
        <br><br>

        <label>Feedback Type</label><br>
        <select>
            <option>Select Feedback Type</option>
            <option>Website Feedback</option>
            <option>Course Feedback</option>
            <option>Suggestion</option>
            <option>Other</option>
        </select>

        <br><br>

        <label>Feedback: </label><br>
        <textarea placeholder="Write your feedback"></textarea>
        <br>


        <label>How was your experience :</label>
           <li><input type="radio" name="experience">Excellent</li>
           <li><input type="radio" name="experience">Good</li>
           <li><input type="radio" name="experience">Average</li>
           <li><input type="radio" name="experience">Need Improvement</li>


        <br>

        <button type="submit">Submit Feedback</button>
        
        <br><br>

        <p><strong>Thank you for sharing your thoughts with me..😇</strong></p>

    </form>

    <br>
    <footer>©MansiMazodkar2026</footer>

</body>

</html>
